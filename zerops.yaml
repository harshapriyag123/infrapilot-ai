zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm ci && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static

  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - pip install --target backend/vendor -r backend/requirements.txt
      deployFiles:
        - backend

    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /health
        failureTimeout: 60
        retryPeriod: 5

    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        PYTHONPATH: /var/www/backend/vendor:/var/www
        DATABASE_URL: ${db_connectionString}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        OPENAI_MODEL: ${OPENAI_MODEL}
        CORS_ORIGINS: ${CORS_ORIGINS}

      start: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000

      healthCheck:
        httpGet:
          port: 8000
          path: /health

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - pip install --target backend/vendor -r backend/requirements.txt
      deployFiles:
        - backend

    run:
      base: python@3.12

      envVariables:
        PYTHONPATH: /var/www/backend/vendor:/var/www
        DATABASE_URL: ${db_connectionString}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        OPENAI_MODEL: ${OPENAI_MODEL}
        WORKER_POLL_SECONDS: "2"

      start: cd backend && python worker.py