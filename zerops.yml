zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm ci && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static

  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - pip install --target backend/vendor -r backend/requirements.txt
      deployFiles:
        - backend

    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /health
        failureTimeout: 60s
        retryPeriod: 10s

    run:
      base: python@3.12

      ports:
        - port: 8000
          httpSupport: true

      # Secrets like GITHUB_TOKEN and OPENAI_API_KEY should be configured
      # in the Zerops UI under the service's Environment variables -> Secret variables.
      # Do not re-declare them here as normal runtime envVariables.
      envVariables:
        PYTHONPATH: /var/www/backend/vendor:/var/www
        DATABASE_URL: ${db_connectionString}

      start: sh -c 'cd /var/www/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'

      healthCheck:
        httpGet:
          port: 8000
          path: /health
        failureTimeout: 60s
        disconnectTimeout: 30s
        recoveryTimeout: 30s
        execPeriod: 10s

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - pip install --target backend/vendor -r backend/requirements.txt
      deployFiles:
        - backend

    run:
      base: python@3.12

      # Secrets like GITHUB_TOKEN and OPENAI_API_KEY should be configured
      # in the Zerops UI under the service's Environment variables -> Secret variables.
      # Do not re-declare them here as normal runtime envVariables.
      envVariables:
        PYTHONPATH: /var/www/backend/vendor:/var/www
        DATABASE_URL: ${db_connectionString}
        WORKER_POLL_SECONDS: "2"

      start: sh -c 'cd /var/www/backend && python worker.py'